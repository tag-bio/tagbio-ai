# Deployment metadata for the clinic FC in a production cluster. One top-level key per deployed
# INSTANCE (see references/manifest.md → "One repo, many instances"). Everything here is generic
# and illustrative — replace names, sizes, and coordinates for a real deploy.

# Instance 1: serve the archive built and QC'd beforehand (see references/preprocessing-and-rebuilds.md).
# The manifest carries the product definition and license; command run_server keeps the engine from
# trying to build from its data_model, and archive overrides the manifest's build-time path with the
# copy the deploy pipeline fetched into the image.
fc-clinic:
  fcCommand:
    fcArgs:
      command: run_server
      manifest: manifest.json
      archive: ./archive.ser
      run_tests: "true"
      r_sdk: "$TAGBIO_R_UTILS"
      python_sdk: "$TAGBIO_PY"
      groups: "lax"                   # in-FC group filtering; NOT the access boundary (SSO/gateway is — governance.md)
    jar: fc_csv_server.jar
    javaArgs:
      Xss: 5M
      Xmx: 1G                         # tune to the data (governance.md)
  livenessProbe:
    initialDelaySeconds: 60
    path: '/s'
    periodSeconds: 60
    port: 8000
  reservation:
    cpu: 100m
    memory: 1G

